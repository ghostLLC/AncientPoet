events {}

http {
    upstream ancientpoet_api {
        server 127.0.0.1:8080;
    }

    # 限流配置
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

    server {
        listen 80;
        server_name api.ancientpoet.com;

        # Let's Encrypt 验证
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 跳转 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name api.ancientpoet.com;

        ssl_certificate /etc/letsencrypt/live/api.ancientpoet.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.ancientpoet.com/privkey.pem;

        # 安全头
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        # 上传文件大小限制（绘画图片）
        client_max_body_size 10M;

        # API 代理
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://ancientpoet_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MinIO 静态资源代理（图片等）
        location /static/ {
            proxy_pass http://127.0.0.1:9000/ancientpoet/;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
