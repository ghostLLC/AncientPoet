# Replace the example domain and certificate paths.
# Ktor must listen on loopback; set TRUSTED_PROXY_HOSTS=127.0.0.1,::1.
events {}
http {
    upstream ancientpoet_api { server 127.0.0.1:8080; }
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
    server {
        listen 80;
        server_name api.example.com;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name api.example.com;
        ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        client_max_body_size 128k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://ancientpoet_api;
        }
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ancientpoet_api;
        }
        location / { return 404; }
    }
}
