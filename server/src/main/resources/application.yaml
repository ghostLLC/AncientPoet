ktor:
  deployment:
    port: ${APP_PORT:-8080}
    host: ${APP_HOST:-0.0.0.0}
  application:
    modules:
      - com.ancientpoet.server.ApplicationKt.module

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:-ancientpoet}
  audience: ${JWT_AUDIENCE:-ancientpoet-client}
  accessExpireMinutes: ${JWT_ACCESS_EXPIRE_MINUTES:-60}
  refreshExpireDays: ${JWT_REFRESH_EXPIRE_DAYS:-30}
