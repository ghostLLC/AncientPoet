<body class="bg-rice-paper text-ink-black font-body-standard min-h-screen relative overflow-x-hidden selection:bg-vermilion-red selection:text-rice-paper">
<!-- Full-screen texture overlay -->

<button class="md:hidden text-vermilion-red hover:bg-surface-container-low transition-colors duration-500 p-2 rounded-full flex items-center justify-center">

</button>
<h1 class="font-headline-poet text-headline-poet text-vermilion-red hidden md:block">鸿雁</h1>
</div>
<!-- Mobile Title -->
<h1 class="font-headline-poet text-headline-poet text-vermilion-red md:hidden">鸿雁</h1>
<!-- Desktop Navigation Cluster (Hidden on Mobile) -->
<nav class="hidden md:flex items-center gap-8">
<a class="font-label-ui text-label-ui text-warm-gray hover:text-primary transition-all duration-500 flex flex-col items-center gap-1" href="#">

</a>
<a class="font-label-ui text-label-ui text-primary font-bold flex flex-col items-center gap-1 opacity-80 transition-opacity duration-300" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mail</span>
<span>传书</span>
</a>
<a class="font-label-ui text-label-ui text-warm-gray hover:text-primary transition-all duration-500 flex flex-col items-center gap-1" href="#">
<span class="material-symbols-outlined">timeline</span>
<span>溯源</span>
</a>

<span class="material-symbols-outlined">person</span>
<span>吾身</span>
</a>
</nav>
<!-- Trailing Icon (Quick Entry) -->
<button aria-label="驿站快捷入口" class="text-vermilion-red hover:bg-surface-container-low transition-colors duration-500 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">history_edu</span>
</button>
</div>
</header>

<div class="w-full mb-12 mt-4 pl-2">
<h2 class="font-headline-display text-headline-display text-ink-black tracking-widest">案台</h2>
<p class="font-body-standard text-body-standard text-warm-gray mt-2">纸短情长，见字如面。</p>
</div>
<!-- Desk Layout: Staggered Envelope Cards -->
<div class="w-full flex flex-col gap-6 relative">
<!-- Card 1: Delivered, Unread (Vermilion Seal) -->
<article class="relative w-[95%] sm:w-full ml-auto bg-surface-container-lowest border border-outline-variant rounded-sm p-6 shadow-sm transform rotate-[1deg] hover:rotate-0 transition-transform duration-700 cursor-pointer group">
<!-- Vermilion Red Wax Seal -->
<div class="absolute top-4 right-4 w-8 h-8 bg-vermilion-red rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-rice-paper text-sm" style="font-variation-settings: 'FILL' 1;">trip_origin</span>
</div>
<div class="flex items-center gap-3 mb-4">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center border border-outline-variant">
<span class="font-headline-poet text-lg text-ink-black">苏</span>
</div>
<div>
<h3 class="font-headline-poet text-xl text-ink-black leading-none">苏轼</h3>
<p class="font-label-ui text-label-ui text-warm-gray mt-1">岭南驿 · 己亥年</p>
</div>
</div>
<div class="pl-13">
<p class="font-body-letter text-body-letter text-ink-black line-clamp-2">
                        吾弟辙：近来可好？惠州风物殊异，荔枝将熟，日啖三百颗，不辞长作岭南人。
                    </p>
</div>
</article>
<!-- Card 2: In Transit (Delayed) -->
<article class="relative w-[92%] sm:w-[95%] mr-auto bg-surface border border-outline-variant rounded-sm p-6 transform -rotate-[2deg] hover:-rotate-1 transition-transform duration-700 cursor-pointer opacity-90">
<div class="absolute inset-0 bg-secondary-container opacity-5 pointer-events-none"></div>
<div class="flex justify-between items-start mb-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center border border-outline-variant opacity-70">
<span class="font-headline-poet text-lg text-ink-black">白</span>
</div>
<div>
<h3 class="font-headline-poet text-xl text-on-surface-variant leading-none">李白</h3>
<p class="font-label-ui text-label-ui text-warm-gray mt-1">发往：长安</p>
</div>
</div>
<!-- Transit Indicator -->
<div class="flex flex-col items-end gap-1">
<span class="material-symbols-outlined text-warm-gray">schedule</span>
<span class="font-label-ui text-label-ui text-warm-gray">预计三日后到达</span>
</div>
</div>
<div class="pl-13">
<div class="h-6 w-3/4 bg-surface-variant rounded animate-pulse opacity-40"></div>
<div class="h-6 w-1/2 bg-surface-variant rounded animate-pulse opacity-40 mt-2"></div>
</div>
</article>
<!-- Card 3: Delivered, Read -->
<article class="relative w-[96%] sm:w-full mx-auto bg-surface-container-lowest border border-outline-variant rounded-sm p-6 shadow-sm transform rotate-[-0.5deg] hover:rotate-0 transition-transform duration-700 cursor-pointer opacity-80">
<div class="flex items-center gap-3 mb-4">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center border border-outline-variant">
<span class="font-headline-poet text-lg text-ink-black">甫</span>
</div>
<div>
<h3 class="font-headline-poet text-xl text-on-surface-variant leading-none">杜甫</h3>
<p class="font-label-ui text-label-ui text-warm-gray mt-1">成都草堂 · 半月前</p>
</div>
</div>
<div class="pl-13">
<p class="font-body-letter text-body-letter text-on-surface-variant line-clamp-2">
                        八月秋高风怒号，卷我屋上三重茅。近来成都多雨，茅屋破损，甚是凄凉，不知君处光景几何？
                    </p>
</div>
</article>
</div>

<span class="font-label-ui text-label-ui mt-1 font-bold">传书</span>
</a>

<span class="material-symbols-outlined group-hover:scale-110 transition-transform duration-500">timeline</span>
<span class="font-label-ui text-label-ui mt-1">溯源</span>

<a class="flex flex-col items-center justify-center text-warm-gray p-2 hover:text-primary transition-all duration-500 group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform duration-500">person</span>
