          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface text-on-surface font-body-standard text-body-standard antialiased h-screen overflow-hidden select-none">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-rice-paper shadow-sm">
<button class="text-primary hover:bg-surface-container-low transition-colors duration-500 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-poet text-headline-poet text-vermilion-red tracking-widest">鸿雁</h1>
<button class="text-vermilion-red hover:bg-surface-container-low transition-colors duration-500 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">history_edu</span>
</button>
</header>
<!-- Map Canvas (Main Content) -->
<main class="relative w-full h-full pt-16 pb-20 md:pb-0 bg-rice-paper/50">
<!-- Faded Ink Wash Background -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center opacity-70 mix-blend-multiply" data-alt="A textured, faded antique Chinese map background painted on traditional rice paper. The artwork features delicate, minimalist ink-wash brushstrokes depicting rolling mountains and meandering rivers in subtle shades of warm grey and pale sepia. The overall aesthetic embodies 'Slowness as a Feature' with a serene, historical atmosphere, devoid of modern clutter. Soft, diffused lighting enhances the tactile, fibrous texture of the paper." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA__frIZmDzQaj3TmTkpQ7D39IJfEbY1z3tWsd8D6FlTQqmXbVRSnSps78MPr5Nsr-22NABbOj1FYIyhVana-WZvUdKsFRqU8geFL4PkwdNbfJUv4ihBT8soXe8t6jh6tuEQZYhXCZFvKwqSLWbwV5Ncbbp9Ak--ZOvTGVA_4CVyHj_24DafdgCFCmIew0Xj4NXwvqOd07qiQ0robVri0NZK2V3S7pBj_jMk67zFghlyY1P5JhikrQIBSi67mPZfoh7di12q9sMvgvY');">
</div>
<!-- Interactive Map Layer -->
<div class="relative w-full h-full max-w-4xl mx-auto">
<!-- SVG Path (The Journey Line) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="none">
<!-- Path from Chang'an to Luoyang -->
<path class="opacity-60" d="M 30% 40% Q 50% 25% 70% 60%" fill="none" stroke="#8B8178" stroke-dasharray="6,6" stroke-linecap="round" stroke-width="2"></path>
</svg>
<!-- Poet Location (Chang'an) -->
<div class="absolute top-[40%] left-[30%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center group cursor-pointer">
<!-- Golden Ink Shadow -->
<div class="relative flex items-center justify-center w-12 h-12">
<div class="absolute inset-0 bg-imperial-gold/30 rounded-full blur-md"></div>
<div class="absolute inset-2 bg-imperial-gold/40 rounded-full blur-sm"></div>
<div class="w-3 h-3 bg-imperial-gold rounded-full z-10 shadow-[0_0_8px_rgba(200,164,92,0.8)]"></div>
</div>
<div class="mt-2 text-center">
<span class="block font-headline-poet text-[20px] leading-tight text-ink-black tracking-widest font-bold">长安</span>
<span class="block font-label-ui text-label-ui text-warm-gray mt-1">诗圣居所</span>
</div>
</div>
<!-- User Location (Luoyang) -->
<div class="absolute top-[60%] left-[70%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center group cursor-pointer">
<!-- Vermilion Seal -->
<div class="w-10 h-10 border-2 border-vermilion-red flex items-center justify-center transform rotate-3 bg-rice-paper/80 backdrop-blur-sm shadow-sm relative before:content-[''] before:absolute before:inset-[2px] before:border before:border-vermilion-red/50">
<span class="font-headline-poet text-[18px] text-vermilion-red leading-none font-bold">吾</span>
</div>
<div class="mt-3 text-center">
<span class="block font-headline-poet text-[20px] leading-tight text-ink-black tracking-widest font-bold">洛阳</span>
<span class="block font-label-ui text-label-ui text-warm-gray mt-1">当前位置</span>
</div>
</div>
<!-- Messenger on Path -->
<!-- Positioned roughly at 60% along the quadratic curve -->
<div class="absolute top-[43%] left-[56%] -translate-x-1/2 -translate-y-1/2 flex items-center justify-center">
<div class="bg-rice-paper/90 rounded-full p-1.5 border border-outline-variant/60 shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined text-ink-black text-[20px]">SelectionInverse</span>
</div>
</div>
</div>
<!-- Bottom Status Panel (Glassmorphism / Rice Paper Overlay) -->
<div class="absolute bottom-28 md:bottom-12 left-4 right-4 md:w-[480px] md:left-1/2 md:-translate-x-1/2 z-40">
<div class="bg-rice-paper/85 backdrop-blur-md rounded-xl p-6 border border-outline-variant/40 shadow-[0_8px_32px_rgba(26,26,46,0.05)] relative overflow-hidden">

<div class="absolute -top-4 -right-4 w-20 h-20 opacity-10 pointer-events-none flex items-center justify-center transform rotate-12">
<span class="material-symbols-outlined text-[80px] text-vermilion-red">local_post_office</span>
</div>
<div class="flex flex-col gap-4 relative z-10">
<div>
<h2 class="font-headline-poet text-[24px] font-bold text-ink-black mb-1">距离长安三日路程</h2>
<p class="font-body-standard text-body-standard text-on-surface-variant">信使正翻越秦岭，山高水长，见字如面。</p>
</div>
<!-- Progress Indicator -->
<div class="flex items-center gap-4 mt-2">
<span class="font-label-ui text-label-ui text-warm-gray w-8 text-right">洛阳</span>
<div class="flex-1 h-1.5 bg-surface-variant rounded-full overflow-hidden relative">
<div class="absolute left-0 top-0 h-full bg-imperial-gold w-[65%] rounded-full"></div>
</div>
<span class="font-label-ui text-label-ui text-warm-gray w-8">长安</span>
</div>
</div>
</div>
</div>
</main>

<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-margin-mobile pb-safe bg-rice-paper h-20 md:hidden border-t border-outline-variant shadow-[0_-4px_24px_rgba(0,0,0,0.02)]">
<!-- Tab 1: 驿路 (Active) -->
<button class="flex flex-col items-center justify-center text-vermilion-red p-2 scale-110 transition-transform duration-700 w-16 group">
<div class="relative flex flex-col items-center">
<span class="material-symbols-outlined fill-icon mb-1">map</span>
<span class="font-label-ui text-label-ui font-bold">驿路</span>

<div class="absolute -bottom-2 w-1 h-1 rounded-full bg-vermilion-red"></div>
</div>
</button>

<span class="font-label-ui text-label-ui">溯源</span>
</button>

<button class="flex flex-col items-center justify-center text-warm-gray p-2 hover:text-primary transition-all duration-500 w-16 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform duration-300">person</span>
<span class="font-label-ui text-label-ui">吾身</span>
