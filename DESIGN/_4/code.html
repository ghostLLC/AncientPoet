<!-- TopAppBar (From JSON) -->

<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors duration-500 p-2 rounded-full flex items-center justify-center">

</button>
<h1 class="font-headline-poet text-headline-poet text-vermilion-red tracking-widest">鸿雁</h1>
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors duration-500 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">history_edu</span>
</button>
</header>
<!-- Main Canvas Area -->
<main class="relative z-10 pt-28 pb-48 px-margin-mobile md:px-margin-tablet max-w-3xl mx-auto flex flex-col gap-16">
<!-- Poet Header -->
<div class="text-center mb-4">
<h2 class="font-headline-display text-headline-display text-ink-black opacity-90 tracking-widest">李白</h2>
<div class="flex items-center justify-center gap-2 mt-2">
<span class="w-8 h-[1px] bg-outline-variant"></span>
<span class="font-label-ui text-label-ui text-warm-gray tracking-widest">天宝三载 · 洛阳</span>
<span class="w-8 h-[1px] bg-outline-variant"></span>
</div>
</div>
<!-- Conversation Stream -->
<div class="flex flex-col gap-12">
<!-- Message 1: Poet (Translated State) -->
<div class="relative pl-4 border-l-2 border-transparent">
<!-- Translation Seal -->
<button aria-label="Toggle Translation" class="absolute -right-2 top-0 w-8 h-8 border-2 border-vermilion-red text-vermilion-red flex items-center justify-center rounded-[2px] font-headline-poet text-[16px] leading-none hover:bg-error-container transition-colors duration-300 rotate-2 opacity-90 shadow-sm">
                    译
                </button>
<!-- Classical Text -->
<div class="font-body-letter text-body-letter text-ink-black opacity-90 pr-12" style="line-height: 2.0; letter-spacing: 0.05em;">
                    弃我去者，昨日之日不可留；<br/>
                    乱我心者，今日之日多烦忧。<br/>
                    长风万里送秋雁，对此可以酣高楼。
                </div>
<!-- Translation Text (Faded below) -->
<div class="mt-6 pt-4 border-t border-outline-variant/30 font-body-standard text-body-standard text-warm-gray opacity-80 pr-8" style="line-height: 1.8;">
                    抛弃我而去的，是昨天的时光，它已经不可挽留；<br/>
                    扰乱我心绪的，是今天的时光，它让我烦忧不断。<br/>
                    长风吹拂万里送来阵阵秋雁，面对此景正可以在高楼之上痛饮。
                </div>
</div>
<!-- Message 2: User -->
<div class="relative pr-4 flex flex-col items-end">
<div class="font-body-letter text-body-letter text-ink-black opacity-85 text-right pl-12" style="line-height: 2.0; letter-spacing: 0.05em;">
                    太白兄豪气干云，虽有烦忧，却不改旷达。<br/>
                    千载之后读此句，依然令人觉胸襟为之一开。
                </div>
</div>
<!-- Message 3: Poet (Untranslated State) -->
<div class="relative pl-4">
<!-- Translation Seal (Inactive look) -->
<button aria-label="Toggle Translation" class="absolute -right-2 top-0 w-8 h-8 border border-outline-variant text-outline hover:border-vermilion-red hover:text-vermilion-red flex items-center justify-center rounded-[2px] font-headline-poet text-[16px] leading-none transition-colors duration-300 -rotate-1">
                    译
                </button>
<!-- Classical Text -->
<div class="font-body-letter text-body-letter text-ink-black opacity-90 pr-12" style="line-height: 2.0; letter-spacing: 0.05em;">
                    蓬莱文章建安骨，中间小谢又清发。<br/>
                    俱怀逸兴壮思飞，欲上青天揽明月。<br/>
                    抽刀断水水更流，举杯消愁愁更愁。<br/>
                    人生在世不称意，明朝散发弄扁舟。
                </div>
</div>
</div>
</main>
<!-- Bottom Input Area (Borderless, Faint Lines) -->
<div class="fixed bottom-0 left-0 w-full z-40 bg-rice-paper/95 backdrop-blur-md pt-4 pb-safe border-t-0 shadow-[0_-10px_40px_rgba(245,240,232,0.8)]">

<textarea class="w-full h-full bg-transparent border-none focus:ring-0 resize-none font-body-letter text-body-letter text-ink-black p-0 m-0 focus:outline-none" placeholder="研墨铺纸，落笔生花..." style="line-height: 40px; letter-spacing: 0.05em; margin-top: 2px;"></textarea>
</div>
<!-- Send Button -->
<button class="mb-4 w-12 h-12 flex items-center justify-center text-vermilion-red hover:bg-surface-container-low hover:text-primary rounded-full transition-all duration-500 flex-shrink-0 group">
<span class="material-symbols-outlined text-[28px] group-hover:scale-110 transition-transform duration-500">mail</span>
