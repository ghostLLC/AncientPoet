name: Quality

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master
      - "codex/**"

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run automated tests
        run: ./gradlew :shared:jvmTest :server:test :androidApp:testDebugUnitTest --stacktrace

      - name: Compile all maintained targets
        run: ./gradlew :shared:compileKotlinJvm :server:compileKotlin :desktopApp:compileKotlinJvm :androidApp:assembleDebug --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            shared/build/reports/tests/
            server/build/reports/tests/
            androidApp/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
